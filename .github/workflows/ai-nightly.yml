name: Nightly AI reliability check

# Once a day, the PrepPath evaluation runs with the AI checks on (40 held-out drafts, run twice for repeat-run
# agreement) using the GROQ_API_KEY repository secret. The results JSON is kept as an artifact, and precision,
# recall and agreement are written to the job summary. Without the secret the job is skipped with a message.
on:
  schedule:
    - cron: "41 20 * * *"
  workflow_dispatch:
    inputs:
      brand:
        description: "Which drafts: prepPath (the scheduled run), 2 (Suraksha Health) or all"
        type: choice
        options: [prepPath, "2", all]
        default: prepPath

jobs:
  ai-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # The free tier refuses bursts (429, tokens per minute): pace the drafts and retry a refused one.
      EVAL_PACE_MS: "6000"
      EVAL_RETRIES: "3"
      EVAL_RETRY_WAIT_MS: "45000"
      # The scheduled run has no inputs, so it is always PrepPath (Groq free-tier limits).
      BRAND: ${{ github.event.inputs.brand || 'prepPath' }}
    steps:
      - name: Check for the GROQ_API_KEY secret
        id: key
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Skipped: the GROQ_API_KEY repository secret is not set (Settings > Secrets and variables > Actions)." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'
      - uses: actions/setup-node@v4
        if: steps.key.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.key.outputs.present == 'true'
      - name: Evaluate with AI (PrepPath, 40 held-out drafts, twice)
        if: steps.key.outputs.present == 'true'
        run: |
          set -o pipefail
          if [ "$BRAND" = "prepPath" ]; then
            npx tsx scripts/eval.ts --ai | tee eval-output.txt
            echo "RESULTS=src/lib/eval/ai-results.json" >> "$GITHUB_ENV"
          else
            npx tsx scripts/eval.ts --ai --brand "$BRAND" | tee eval-output.txt
            echo "RESULTS=src/lib/eval/ai-results-brand-$BRAND.json" >> "$GITHUB_ENV"
          fi
      - name: Write the summary
        if: steps.key.outputs.present == 'true'
        run: |
          node -e '
            const r = require("./" + process.env.RESULTS);
            const p = (x) => (x * 100).toFixed(1) + "%";
            const ci = (a) => a ? " (" + a.map(p).join("–") + ")" : "";
            const lines = [
              "## AI reliability check (" + (process.env.BRAND === "prepPath" ? "PrepPath" : process.env.BRAND === "2" ? "Suraksha Health" : "both brands") + ", " + r.docs + " held-out drafts)",
              "",
              r.aiDocs === r.docs ? "Verified: the AI answered on every draft." : "**Not a verified AI run:** the AI answered on " + r.aiDocs + " of " + r.docs + " drafts; the rest were scored by the code checks alone. Errors: " + (r.aiErrors || []).join(" | ").slice(0, 400),
              "",
              "| Measure | Result |", "| --- | --- |",
              "| Mode | " + r.mode + " |",
              "| Drafts the AI answered on | " + (r.aiDocs ?? "n/a") + " of " + r.docs + " |",
              "| Precision | " + p(r.precision) + ci(r.precisionCI) + " |",
              "| Recall | " + p(r.recall) + ci(r.recallCI) + " |",
              "| Hard phrasings caught | " + r.hardCaught + " of " + r.hardPlanted + " |",
              "| Clean drafts left alone | " + (r.cleanDrafts ? r.cleanDrafts.noViolations + " of " + r.cleanDrafts.clean : "n/a") + " |",
              "| Same result on both runs | " + p(r.agreement) + " |",
            ];
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          '
      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.present == 'true'
        with:
          name: ai-eval-results
          path: |
            src/lib/eval/ai-results*.json
            eval-output.txt
      - name: Fail unless the AI answered on every draft
        if: steps.key.outputs.present == 'true'
        run: node -e 'const r = require("./" + process.env.RESULTS); if (r.aiDocs !== r.docs) { console.error("The AI answered on " + r.aiDocs + " of " + r.docs + " drafts."); process.exit(1); }'
